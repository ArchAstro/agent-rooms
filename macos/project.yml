name: Rooms
options:
  bundleIdPrefix: ai.archastro
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

# Keep release builds reproducible. Update this revision deliberately when
# adopting a newer ArchAstroPlatform commit.
packages:
  ArchAstroPlatform:
    url: https://github.com/ArchAstro/archastro-swift
    revision: 08fb1b5f92ac5f8997d252398a05105810e60bdc
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    revision: 5f613358148239d0292c0cef674a3c2314737f9e

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    CURRENT_PROJECT_VERSION: "2"
    MARKETING_VERSION: "0.1.1"

targets:
  Rooms:
    type: application
    platform: macOS
    sources:
      - Rooms
    dependencies:
      - package: ArchAstroPlatform
        product: ArchAstroPlatform
      - package: MarkdownUI
        product: MarkdownUI
    entitlements:
      path: Rooms/Rooms.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Loopback listener for the browser sign-in redirect (RFC 8252).
        com.apple.security.network.server: true
    info:
      path: Rooms/Info.plist
      properties:
        CFBundleDisplayName: Rooms
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "Copyright © 2026 ArchAstro Inc."
        # Menu-bar app: no Dock icon, no app switcher entry.
        LSUIElement: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.archastro.Rooms

  RoomsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - RoomsTests
    dependencies:
      - target: Rooms
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Rooms:
    build:
      targets:
        Rooms: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RoomsTests
