name: Rooms
options:
  bundleIdPrefix: ai.archastro
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

# Tracks main until the first tagged release — then pin with `from: x.y.z`.
packages:
  ArchAstroPlatform:
    url: https://github.com/ArchAstro/archastro-swift
    branch: main

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"

targets:
  Rooms:
    type: application
    platform: macOS
    sources:
      - Rooms
    dependencies:
      - package: ArchAstroPlatform
        product: ArchAstroPlatform
    entitlements:
      path: Rooms/Rooms.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Loopback listener for the browser sign-in redirect (RFC 8252).
        com.apple.security.network.server: true
    info:
      path: Rooms/Info.plist
      properties:
        CFBundleDisplayName: Rooms
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "Copyright © 2026 ArchAstro Inc."
        # Menu-bar app: no Dock icon, no app switcher entry.
        LSUIElement: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.archastro.Rooms

  RoomsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - RoomsTests
    dependencies:
      - target: Rooms
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Rooms:
    build:
      targets:
        Rooms: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RoomsTests
