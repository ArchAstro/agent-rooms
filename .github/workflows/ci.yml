name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: compile
        run: |
          python3 -m py_compile $(find skills/team-room -name '*.py' -print)
          node --check bin/install.mjs
      - name: unit suites
        run: |
          set -e
          for f in tests/test_*.py; do
            echo "== $f"; python3 "$f"
          done
      - name: installer sandbox battery
        run: bash tests/installer_battery.sh

  macos:
    name: macOS app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: macos
        run: xcodegen generate

      - name: Build and test without signing
        working-directory: macos
        run: |
          set -euo pipefail
          xcodebuild \
            -project Rooms.xcodeproj \
            -scheme Rooms \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData-test \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test

      - name: Package DMG end-to-end proof
        working-directory: macos
        run: ./scripts/test-package-dmg.sh
