name: Release DMG

# Sign only reviewed code: a merged release/v* PR, or a manual run on main.
# PRs and branch pushes exercise the layout with an ad-hoc build in CI.
on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag matching main's MARKETING_VERSION (e.g. v0.1.0)"
        required: true
        type: string

concurrency:
  group: release-dmg
  cancel-in-progress: false

jobs:
  resolve-release:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release/v'))
    name: Resolve reviewed release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate reviewed commit and create tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TAG: ${{ inputs.tag }}
          MERGE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch origin main --tags

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            TAG="${RELEASE_BRANCH#release/}"
            COMMIT="$MERGE_COMMIT"
          else
            TAG="$MANUAL_TAG"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: expected vMAJOR.MINOR.PATCH, got: $TAG" >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            git rev-parse "$TAG^{commit}" >/dev/null 2>&1 || {
              echo "error: manual reruns require an existing tag: $TAG" >&2
              exit 1
            }
            COMMIT="$(git rev-parse "$TAG^{commit}")"
          fi

          git merge-base --is-ancestor "$COMMIT" origin/main || {
            echo "error: release commit is not on main" >&2
            exit 1
          }
          VERSION="$(
            git show "$COMMIT:macos/project.yml" |
              sed -n 's/^[[:space:]]*MARKETING_VERSION: "\([^"]*\)"/\1/p' |
              head -1
          )"
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "error: tag $TAG does not match MARKETING_VERSION $VERSION" >&2
            exit 1
          fi

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_COMMIT="$(git rev-parse "$TAG^{commit}")"
            [[ "$TAG_COMMIT" == "$COMMIT" ]] || {
              echo "error: $TAG already points to another commit" >&2
              exit 1
            }
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$COMMIT" -m "Rooms $TAG"
            git push origin "$TAG"
          fi
          echo "commit=$COMMIT" >>"$GITHUB_OUTPUT"
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"

  release-dmg:
    needs: resolve-release
    name: Signed notarized DMG
    runs-on: macos-15
    timeout-minutes: 60
    environment: macos-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The resolver proved this exact commit is reviewed main history.
          ref: ${{ needs.resolve-release.outputs.commit }}
          fetch-depth: 0

      - name: Check signing secrets
        id: secrets
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERT_PW: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_CODE_SIGN_IDENTITY }}
          TEAM: ${{ secrets.MACOS_DEVELOPMENT_TEAM }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          KEY_B64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PW: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${CERT:-}" ]] || missing+=(MACOS_CERTIFICATE_P12_BASE64)
          [[ -n "${CERT_PW:-}" ]] || missing+=(MACOS_CERTIFICATE_PASSWORD)
          [[ -n "${IDENTITY:-}" ]] || missing+=(MACOS_CODE_SIGN_IDENTITY)
          [[ -n "${TEAM:-}" ]] || missing+=(MACOS_DEVELOPMENT_TEAM)
          if [[ -z "${KEY_ID:-}" || -z "${ISSUER:-}" || -z "${KEY_B64:-}" ]]; then
            if [[ -z "${APPLE_ID:-}" || -z "${APP_PW:-}" ]]; then
              missing+=(APPLE_API_KEY_ID/ISSUER/BASE64_or_APPLE_ID+APP_SPECIFIC_PASSWORD)
            fi
          fi
          if ((${#missing[@]})); then
            echo "Missing secrets:"
            printf '  %s\n' "${missing[@]}"
            echo "See docs/SIGNING.md"
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x macos/scripts/ci-import-certificate.sh
          ./macos/scripts/ci-import-certificate.sh --preserve-keychain

      - name: Build, sign, notarize DMG
        working-directory: macos
        env:
          CODE_SIGN_IDENTITY: ${{ secrets.MACOS_CODE_SIGN_IDENTITY }}
          DEVELOPMENT_TEAM: ${{ secrets.MACOS_DEVELOPMENT_TEAM }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          set -euo pipefail
          chmod +x scripts/package-dmg.sh
          VERSION="${TAG#v}"
          DMG="$GITHUB_WORKSPACE/dist/Rooms-${VERSION}.dmg"
          ./scripts/package-dmg.sh --out "$DMG"
          test -f "$DMG"
          ls -lh "$GITHUB_WORKSPACE/dist/"

      - name: Remove signing keychain
        if: always()
        run: ./macos/scripts/ci-import-certificate.sh --cleanup

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Rooms-${{ needs.resolve-release.outputs.tag }}-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 90

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Rooms $TAG" \
              --generate-notes \
              dist/*.dmg
          else
            gh release upload "$TAG" dist/*.dmg --clobber
          fi
