kind: CustomObjectSchema
name: Team Presence
description: One living row per person+worktree, refreshed by every room-post,
  answering "who is working where, on what, how recently".
lookup_key: team-presence
row_key:
  - scope_id
search_fields:
  - human
  - worktree
  - intent
json_schema:
  type: object
  properties:
    scope_id:
      type: string
      description: "human/worktree, e.g. vivek/wt1 — one row per pair"
    human:
      type: string
    worktree:
      type: string
    branch:
      type: string
    intent:
      type: string
      description: Headline of the most recent post from this pair
    last_post_type:
      type: string
      description: start | done | lesson | handoff | question | abandoned
  required:
    - scope_id
    - human
    - worktree
